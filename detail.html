<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LFmall 기획전 상세 분석</title>
  <link rel="icon" type="image/png" href="./exhibition_analytics_icon.png">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Vanilla CSS Style -->
  <link rel="stylesheet" href="./style.css">
  
  <!-- React & Babel Standalone via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" src="./components/CampaignDetail.js"></script>
</head>
<body>
  
  <div id="root" style="max-width: 1500px; margin: 0 auto; padding: var(--spacing-xl) var(--spacing-lg);"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [campaignId, setCampaignId] = useState(null);
      const [campaignData, setCampaignData] = useState(null);
      const [isLoading, setIsLoading] = useState(true);

      const getFormattedDate = (offsetDays = 0) => {
        const now = Date.now();
        const d = new Date(now + 9 * 60 * 60 * 1000 - offsetDays * 24 * 60 * 60 * 1000);
        const y = d.getUTCFullYear();
        const m = String(d.getUTCMonth() + 1).padStart(2, '0');
        const day = String(d.getUTCDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      };

      // 1. URL 쿼리 파라미터에서 기획전 ID 및 타이틀 파싱 (초기 락 방지)
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const incomingTitle = params.get('title') || `기획전 캠페인 (ID: ${id})`;
        const qStart = params.get('startDate');
        const qEnd = params.get('endDate');
        
        if (!id) {
          // ID가 누락된 경우 메인 대시보드로 강제 튕기기
          window.location.href = './index.html';
          return;
        }
        setCampaignId(id);

        // URL 타이틀에 포함된 브랜드 정보 파싱
        const brandMatch = incomingTitle.match(/\(([^)]+)\)/);
        const derivedBrand = brandMatch ? brandMatch[1] : 'LF MALL';

        // 1차 바인딩: API Fetch 완료 전에 한글 진짜 명칭을 미리 보여주어 UX 신뢰도 향상
        setCampaignData({
          id: id,
          title: incomingTitle,
          brand: derivedBrand,
          pv: 0,
          uv: 0,
          clicks: 0,
          revenue: 0,
          avgStay: '0s',
          bounceRate: '0%',
          cvr: '0.0%'
        });

        // 2. 해당 기획전의 통계 데이터를 메인 API로부터 조회해서 세팅
        const isVercelLive = window.location.hostname.includes('vercel.app') || (window.location.hostname.includes('localhost') && window.location.port === '3000');
        const apiBaseUrl = isVercelLive ? '' : 'https://exhibition-analysis-bychoi-s-projects.vercel.app';

        const today = qEnd || getFormattedDate(0);
        const sevenDaysAgo = qStart || getFormattedDate(7);

        fetch(`${apiBaseUrl}/api/stats?startDate=${sevenDaysAgo}&endDate=${today}`)
          .then(res => res.json())
          .then(data => {
            const currentEx = data.pages?.find(p => p.id === id);
            if (currentEx) {
              // API에서 최신 PV, UV, 매출액을 가져오되, 한글 타이틀이 세팅되어 있으면 유지
              setCampaignData({
                ...currentEx,
                title: currentEx.title && currentEx.title !== '기획전 캠페인' ? currentEx.title : incomingTitle,
                brand: currentEx.brand || derivedBrand
              });
            }
            setIsLoading(false);
          })
          .catch(err => {
            console.error('[LOAD-STATS-ERROR]', err);
            setIsLoading(false);
          });
      }, []);

      if (isLoading) {
        return (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '60vh', gap: '16px' }}>
            <div className="loading-spinner" style={{
              width: '40px',
              height: '40px',
              border: '4px solid rgba(255, 77, 139, 0.2)',
              borderTop: '4px solid var(--colors-brand-pink)',
              borderRadius: '50%',
              animation: 'spin 1s linear infinite'
            }} />
            <span style={{ fontSize: '14px', color: 'var(--colors-muted)', fontWeight: '500' }}>기획전 분석 통계를 불러오는 중입니다...</span>
          </div>
        );
      }

      return (
        <CampaignDetail 
          campaignId={campaignId} 
          campaignData={campaignData} 
          onBack={() => {
            window.location.href = './index.html';
          }} 
        />
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
