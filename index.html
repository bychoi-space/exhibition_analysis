<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LFmall 기획전 성과 분석</title>
  <link rel="icon" type="image/png" href="./exhibition_analytics_icon.png">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Vanilla CSS Style -->
  <link rel="stylesheet" href="./style.css">
  
  <!-- React & Babel Standalone via CDN (Safe from CORS on file://) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Component Modules (Imported with type="text/babel" for standalone run) -->
  <script type="text/babel" src="./components/Icons.js"></script>
  <script type="text/babel" src="./components/FunnelChart.js"></script>
  <script type="text/babel" src="./components/CampaignGrid.js"></script>
  <script type="text/babel" src="./components/Dashboard.js"></script>
</head>
<body>
  
  <div id="root"></div>

  <!-- Bootstrapper / Orchestrator Script -->
  <script type="text/babel">
    function App() {
      return (
        <div className="app-container">
          <main className="workspace-frame">
            <div className="pane dashboard-pane-container" style={{ width: '100%' }}>
              <window.AnalyticsDashboard />
            </div>
          </main>
        </div>
      );
    }

    // Mounting React to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
