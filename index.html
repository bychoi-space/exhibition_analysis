<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clay Analytics - LF Mall 기획전 성과 분석기</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Vanilla CSS Style (Safe from CORS on file://) -->
  <link rel="stylesheet" href="./style.css">
  
  <!-- React & Babel Standalone via CDN (Safe from CORS on file://) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  
  <div id="root"></div>

  <!-- Inline Babel Script (100% Immune to CORS on file:// protocol!) -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ==========================================================================
    // 1. INLINE CUSTOM SVG ICONS (Self-contained and CORS-safe)
    // ==========================================================================
    
    const IconBarChart = ({ size = 14 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" x2="18" y1="20" y2="10" /><line x1="12" x2="12" y1="20" y2="4" /><line x1="6" x2="6" y1="20" y2="14" /></svg>
    );

    const IconUsers = ({ size = 14, color }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color || "currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></svg>
    );

    const IconEye = ({ size = 14, color }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color || "currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" /></svg>
    );

    const IconClock = ({ size = 14, color }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color || "currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg>
    );

    const IconTrendingUp = ({ size = 14, color }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color || "currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17" /><polyline points="16 7 22 7 22 13" /></svg>
    );

    const IconSparkles = ({ size = 14, color }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color || "currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" /></svg>
    );

    const IconRefresh = ({ size = 12 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M3 21v-5h5" /></svg>
    );

    const IconZap = ({ size = 14, color }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color || "currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></svg>
    );

    const IconPlay = ({ size = 14 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3" /></svg>
    );

    const IconPause = ({ size = 14 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" /></svg>
    );

    const IconTrash = ({ size = 14 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></svg>
    );

    const IconHelp = () => (
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10" /><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><line x1="12" x2="12.01" y1="17" y2="17" /></svg>
    );

    // ==========================================================================
    // ==========================================================================
    // 2. LF MALL METRICS SIMULATED TELEMETRY DATABASE (Korean & Exhibition Focused)
    // ==========================================================================

    const STORAGE_KEY = 'lfmall_analytics_events';
    const USER_KEY = 'lfmall_analytics_user';
    const SESSION_KEY = 'lfmall_analytics_session';

    const EXHIBITION_METADATA = {
      '103291': '닥스 봄 데일리 스페셜 위크 (DAKKS)',
      '992831': '아떼 바캉스 실크 원피스 컬렉션 (ATHE)',
      '553920': '헤지스 남성 트렌디 린넨 캐주얼 대전 (HAZZYS)',
      '402391': '명품 해외 패션 럭셔리 시즌 오프 (LUXURY)'
    };

    const getOrGenerateId = (key, storage) => {
      let id = storage.getItem(key);
      if (!id) {
        id = 'id_lf_' + Math.random().toString(36).substring(2, 12) + Date.now().toString(36);
        storage.setItem(key, id);
      }
      return id;
    };

    const getUserId = () => getOrGenerateId(USER_KEY, localStorage);
    const getSessionId = () => getOrGenerateId(SESSION_KEY, sessionStorage);

    const extractExhibitionId = (urlPath) => {
      if (!urlPath) return null;
      const matchA = urlPath.match(/\/app\/event\/([a-zA-Z0-9_-]+)/);
      if (matchA) return matchA[1];
      const matchB = urlPath.match(/datacls=([a-zA-Z0-9_-]+)/);
      if (matchB) return matchB[1];
      return null;
    };

    // Seed realistic statistics representing lfmall.co.kr fashion traffic (100% Focused on Exhibitions)
    const seedDatabase = () => {
      console.log('Seeding client exhibition telemetry database...');
      const events = [];
      const now = Date.now();
      const exhibitionIds = Object.keys(EXHIBITION_METADATA);
      
      const userCount = 520;
      const sessionCount = 890;
      const userIds = Array.from({ length: userCount }, (_, i) => `user_lf_${i}_${Math.random().toString(36).substr(2, 4)}`);
      
      for (let s = 0; s < sessionCount; s++) {
        const userId = userIds[s % userCount];
        const sessionId = `sess_lf_${s}_${Math.random().toString(36).substr(2, 4)}`;
        const timeOffset = Math.random() * 5 * 24 * 60 * 60 * 1000; // 5 days
        let timeCursor = now - timeOffset;
        
        // 1. Enter Main Home first (95% chance)
        if (Math.random() < 0.95) {
          events.push({
            timestamp: timeCursor,
            type: 'PAGE_VIEW',
            pageType: 'HOME',
            url: '/',
            sessionId,
            userId,
            extra: { referrer: 'naver_search' }
          });
          timeCursor += 5000 + Math.random() * 15000;
        }
        
        // 2. Click and Enter a specific exhibition! (100% of analyzed traffic)
        const exId = exhibitionIds[s % exhibitionIds.length];
        const isUrlTypeA = Math.random() < 0.5;
        const url = isUrlTypeA 
          ? `/app/event/${exId}` 
          : `/planning.do?cmd=getEventDetail&datacls=${exId}`;

        events.push({
          timestamp: timeCursor,
          type: 'PAGE_VIEW',
          pageType: 'CATEGORY', // exhibition
          url,
          sessionId,
          userId,
          extra: { exhibitionId: exId, exhibitionTitle: EXHIBITION_METADATA[exId] }
        });
        
        timeCursor += 8000 + Math.random() * 35000; // Users browse exhibition page for 8-43s
        
        // 3. Clicks on products inside the exhibition page (70% chance)
        if (Math.random() < 0.7) {
          const prodId = `LF-PROD-${10000 + Math.floor(Math.random() * 90000)}`;
          events.push({
            timestamp: timeCursor,
            type: 'PAGE_VIEW',
            pageType: 'PRODUCT_DETAIL',
            url: `/product/${prodId}`,
            sessionId,
            userId,
            extra: { productId: prodId, lastExhibitionId: exId }
          });
          
          timeCursor += 10000 + Math.random() * 40000;
          
          // 4. Add to cart from product (35% chance)
          if (Math.random() < 0.35) {
            const price = 80000 + Math.floor(Math.random() * 450000); // 80k to 530k KRW
            events.push({
              timestamp: timeCursor,
              type: 'ADD_TO_CART',
              pageType: 'PRODUCT_DETAIL',
              elementId: 'add-to-cart-btn',
              sessionId,
              userId,
              extra: { productId: prodId, price, lastExhibitionId: exId }
            });
            
            timeCursor += 4000 + Math.random() * 12000;
            
            events.push({
              timestamp: timeCursor,
              type: 'PAGE_VIEW',
              pageType: 'CART',
              url: '/cart',
              sessionId,
              userId,
              extra: { lastExhibitionId: exId }
            });
            
            timeCursor += 5000 + Math.random() * 10000;
            
            // 5. Start Checkout (60% chance)
            if (Math.random() < 0.6) {
              events.push({
                timestamp: timeCursor,
                type: 'PAGE_VIEW',
                pageType: 'CHECKOUT',
                url: '/order/payment',
                sessionId,
                userId,
                extra: { lastExhibitionId: exId }
              });
              
              timeCursor += 15000 + Math.random() * 40000;
              
              // 6. Complete Purchase and attribute revenue (65% chance)
              if (Math.random() < 0.65) {
                events.push({
                  timestamp: timeCursor,
                  type: 'PURCHASE',
                  pageType: 'CHECKOUT',
                  elementId: 'pay-now-btn',
                  sessionId,
                  userId,
                  extra: { orderId: 'LF_' + Math.floor(200000 + Math.random() * 800000), revenue: price, attributedExhibitionId: exId }
                });
                
                events.push({
                  timestamp: timeCursor + 100,
                  type: 'PAGE_VIEW',
                  pageType: 'PURCHASE',
                  url: '/order/complete',
                  sessionId,
                  userId,
                  extra: { lastExhibitionId: exId }
                });
              }
            }
          }
        }
      }
      
      events.sort((a, b) => a.timestamp - b.timestamp);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
      return events;
    };

    const getRawEvents = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return seedDatabase();
        return JSON.parse(raw);
      } catch (e) {
        return [];
      }
    };

    const saveEvents = (events) => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
      window.dispatchEvent(new CustomEvent('clay_analytics_update'));
    };

    const resetDatabase = () => {
      localStorage.removeItem(STORAGE_KEY);
      seedDatabase();
      window.dispatchEvent(new CustomEvent('clay_analytics_update'));
    };

    // Calculate aggregated statistics locally (Perfect attribution logic match)
    const getLocalAggregatedStats = () => {
      const events = getRawEvents();
      
      const sessionToLastExhibition = {};
      const exhibitionStats = {};

      // Initialize
      Object.keys(EXHIBITION_METADATA).forEach(id => {
        exhibitionStats[id] = {
          id: id,
          title: EXHIBITION_METADATA[id],
          pv: 0,
          uvSet: new Set(),
          sessionTimes: {},
          attributedRevenue: 0,
          orderCount: 0
        };
      });

      // Walk through logs chronologically
      events.forEach(e => {
        const currentExId = e.extra?.exhibitionId || extractExhibitionId(e.url || '');
        if (currentExId && EXHIBITION_METADATA[currentExId]) {
          sessionToLastExhibition[e.sessionId] = currentExId;
          
          const stats = exhibitionStats[currentExId];
          if (e.type === 'PAGE_VIEW') {
            stats.pv++;
            stats.uvSet.add(e.userId);
            
            if (!stats.sessionTimes[e.sessionId]) stats.sessionTimes[e.sessionId] = [];
            stats.sessionTimes[e.sessionId].push(e.timestamp);
          }
        }

        if (e.type === 'PURCHASE') {
          const lastExId = e.extra?.attributedExhibitionId || sessionToLastExhibition[e.sessionId];
          if (lastExId && exhibitionStats[lastExId]) {
            const rev = parseInt(e.extra?.revenue || 0);
            exhibitionStats[lastExId].attributedRevenue += rev;
            exhibitionStats[lastExId].orderCount++;
          }
        }
      });

      const exhibitionsPerformanceList = Object.values(exhibitionStats).map(ex => {
        const sTimes = Object.values(ex.sessionTimes);
        let totalPTime = 0;
        let singlePViews = 0;
        
        sTimes.forEach(ts => {
          if (ts.length <= 1) {
            singlePViews++;
            totalPTime += 10000;
          } else {
            totalPTime += (Math.max(...ts) - Math.min(...ts));
          }
        });
        
        const avgStay = sTimes.length ? Math.floor((totalPTime / sTimes.length) / 1000) : 0;
        const bounce = sTimes.length ? Math.floor((singlePViews / sTimes.length) * 100) : 0;
        
        return {
          id: ex.id,
          title: ex.title,
          pv: ex.pv,
          uv: ex.uvSet.size,
          avgStay: `${avgStay}s`,
          bounceRate: `${Math.min(bounce, 75)}%`,
          revenue: ex.attributedRevenue,
          cvr: ex.pv ? ((ex.orderCount / ex.pv) * 100).toFixed(1) + '%' : '0.0%'
        };
      }).sort((a, b) => b.revenue - a.revenue);

      // Scorecards
      const exPageViews = events.filter(e => e.type === 'PAGE_VIEW' && (extractExhibitionId(e.url) !== null || e.extra?.exhibitionId));
      const totalExPV = exPageViews.length;
      const totalExUV = new Set(exPageViews.map(e => e.userId)).size;
      const totalRevenue = exhibitionsPerformanceList.reduce((acc, curr) => acc + curr.revenue, 0);

      // Funnel
      const funnelSessions = {};
      events.forEach(e => {
        if (!funnelSessions[e.sessionId]) {
          funnelSessions[e.sessionId] = { home: false, exhibition: false, detail: false, cart: false, purchase: false };
        }
        const s = funnelSessions[e.sessionId];
        if (e.pageType === 'HOME') s.home = true;
        if (extractExhibitionId(e.url) || e.extra?.exhibitionId) s.exhibition = true;
        if (e.pageType === 'PRODUCT_DETAIL') s.detail = true;
        if (e.type === 'ADD_TO_CART') s.cart = true;
        if (e.type === 'PURCHASE') s.purchase = true;
      });
      
      const totalF = Object.keys(funnelSessions).length;
      const fSessions = Object.values(funnelSessions);
      const homeCount = fSessions.filter(s => s.home).length;
      const exhCount = fSessions.filter(s => s.exhibition).length;
      const detCount = fSessions.filter(s => s.detail).length;
      const cartCount = fSessions.filter(s => s.cart).length;
      const purCount = fSessions.filter(s => s.purchase).length;
      
      const getPct = (val) => totalF ? Math.floor((val / totalF) * 100) : 0;

      return {
        stats: {
          totalPV: totalExPV.toLocaleString(),
          uniqueUV: totalExUV.toLocaleString(),
          avgDuration: "0m 35s",
          bounceRate: "16%",
          revenue: `₩${totalRevenue.toLocaleString()}`
        },
        funnel: [
          { name: '1. LF Mall 홈 진입', count: homeCount, rate: getPct(homeCount), color: 'var(--colors-brand-peach)' },
          { name: '2. 기획전 페이지 방문', count: exhCount, rate: getPct(exhCount), color: 'var(--colors-brand-pink)' },
          { name: '3. 기획전 상품 상세 클릭', count: detCount, rate: getPct(detCount), color: 'var(--colors-brand-ochre)' },
          { name: '4. 상품 장바구니 담기', count: cartCount, rate: getPct(cartCount), color: 'var(--colors-brand-lavender)' },
          { name: '5. 최종 구매 완료 (결제)', count: purCount, rate: getPct(purCount), color: 'var(--colors-brand-mint)' }
        ],
        pages: exhibitionsPerformanceList,
        logs: events.slice(-35).reverse()
      };
    };

    // Client-side simulation traffic (Focused entirely on exhibitions!)
    const simulateUserTraffic = () => {
      const userPool = Array.from({ length: 15 }, (_, i) => `sim_user_lf_${Math.floor(Math.random() * 800)}`);
      const exPool = ['103291', '992831', '553920', '402391'];
      
      const userId = userPool[Math.floor(Math.random() * userPool.length)];
      const sessionId = 'sim_sess_lf_' + Math.random().toString(36).substr(2, 7);
      
      const events = getRawEvents();
      const now = Date.now();
      const rand = Math.random();
      
      const exId = exPool[Math.floor(Math.random() * exPool.length)];
      
      if (rand < 0.4) {
        events.push({ timestamp: now, type: 'PAGE_VIEW', pageType: 'HOME', url: '/', sessionId, userId, extra: { referrer: 'direct_traffic' } });
      } else if (rand < 0.75) {
        const path = Math.random() < 0.5 
          ? `/app/event/${exId}` 
          : `/planning.do?cmd=getEventDetail&datacls=${exId}`;
          
        events.push({
          timestamp: now,
          type: 'PAGE_VIEW',
          pageType: 'CATEGORY',
          url: path,
          sessionId,
          userId,
          extra: { exhibitionId: exId, exhibitionTitle: EXHIBITION_METADATA[exId] }
        });
      } else if (rand < 0.9) {
        const prodId = `LF-PROD-${10000 + Math.floor(Math.random() * 90000)}`;
        const price = 80000 + Math.floor(Math.random() * 350000);
        
        events.push({ timestamp: now, type: 'PAGE_VIEW', pageType: 'PRODUCT_DETAIL', url: `/product/${prodId}`, sessionId, userId, extra: { productId: prodId, lastExhibitionId: exId } });
        
        if (Math.random() < 0.5) {
          events.push({ timestamp: now + 500, type: 'ADD_TO_CART', pageType: 'PRODUCT_DETAIL', elementId: 'add-to-cart-btn', sessionId, userId, extra: { productId: prodId, price, lastExhibitionId: exId } });
        }
      } else {
        const price = 120000 + Math.floor(Math.random() * 400000);
        const ordId = 'LF_' + Math.floor(200000 + Math.random() * 800000);
        events.push({ timestamp: now, type: 'PURCHASE', pageType: 'CHECKOUT', elementId: 'pay-now-btn', sessionId, userId, extra: { orderId: ordId, revenue: price, attributedExhibitionId: exId } });
        events.push({ timestamp: now + 60, type: 'PAGE_VIEW', pageType: 'PURCHASE', url: '/order/complete', sessionId, userId, extra: {} });
      }
      
      saveEvents(events);
    };


    // ==========================================================================
    // 3. ANALYTICS DASHBOARD VIEW COMPONENT
    // ==========================================================================

    function AnalyticsDashboard() {
      const initialLocal = getLocalAggregatedStats();
      const [stats, setStats] = useState(initialLocal.stats);
      const [funnel, setFunnel] = useState(initialLocal.funnel);
      const [pages, setPages] = useState(initialLocal.pages);
      const [logs, setLogs] = useState(initialLocal.logs);
      const [isSimulating, setIsSimulating] = useState(false);
      const [simCount, setSimCount] = useState(0);

      const isLiveServer = window.location.protocol.startsWith('http') && !window.location.hostname.endsWith('github.io');

      const refresh = async () => {
        if (isLiveServer) {
          try {
            const res = await fetch('/api/stats');
            const data = await res.json();
            setStats(data.stats);
            setFunnel(data.funnel);
            setPages(data.pages);
            setLogs(data.logs);
          } catch (e) {
            console.error("Failed to fetch live stats from server.", e);
          }
        } else {
          const data = getLocalAggregatedStats();
          setStats(data.stats);
          setFunnel(data.funnel);
          setPages(data.pages);
          setLogs(data.logs);
        }
      };

      useEffect(() => {
        if (isLiveServer) {
          refresh();
          const poll = setInterval(refresh, 2500); // Live poll every 2.5s
          return () => clearInterval(poll);
        } else {
          window.addEventListener('clay_analytics_update', refresh);
          return () => window.removeEventListener('clay_analytics_update', refresh);
        }
      }, []);

      useEffect(() => {
        let timer = null;
        if (isSimulating) {
          timer = setInterval(async () => {
            if (isLiveServer) {
              try {
                await fetch('/api/simulate', { method: 'POST' });
                refresh();
              } catch (e) {
                console.error("Failed to simulate traffic on live server.", e);
              }
            } else {
              simulateUserTraffic();
              setSimCount(c => c + 1);
            }
          }, 1500);
        }
        return () => { if (timer) clearInterval(timer); };
      }, [isSimulating]);

      const handleClear = async () => {
        if (confirm('모든 수집된 트래픽 통계 로그를 삭제하고 초기화하시겠습니까?')) {
          if (isLiveServer) {
            try {
              await fetch('/api/reset', { method: 'POST' });
              refresh();
            } catch (e) {
              console.error("Failed to reset database on live server.", e);
            }
          } else {
            resetDatabase();
            setIsSimulating(false);
            setSimCount(0);
          }
        }
      };

      const handleSimSingle = async () => {
        if (isLiveServer) {
          try {
            await fetch('/api/simulate', { method: 'POST' });
            refresh();
          } catch (e) {
            console.error("Failed to simulate single action on live server.", e);
          }
        } else {
          simulateUserTraffic();
          setSimCount(c => c + 1);
        }
      };

      const formatTime = (ts) => {
        const d = new Date(ts);
        return d.toTimeString().split(' ')[0];
      };

      const getPageTypeClass = (type) => `page-type-pill ${type.toLowerCase()}`;

      return (
        <div className="dashboard-pane" style={{ maxWidth: '1280px', padding: 'var(--spacing-xl) var(--spacing-lg)' }}>
          
          {/* Dashboard Title Header */}
          <div className="dashboard-header-group">
            <div>
              <span className="caption-uppercase" style={{color: 'var(--colors-muted)', display: 'flex', alignItems: 'center', gap: '6px'}}>
                <IconBarChart /> REAL-TIME GROWTH TELEMETRY
              </span>
              <h2 className="display-sm" style={{marginTop: '4px', fontWeight: 500}}>LF Mall 실시간 기획전 성과 분석기</h2>
            </div>
            <div style={{display: 'flex', gap: '12px', alignItems: 'center'}}>
              {isSimulating && (
                <div className="realtime-indicator-pulse">
                  <span className="pulse-dot"></span>
                  <span>실시간 트래픽 수집 중 ({simCount} hits)</span>
                </div>
              )}
              <button className="btn btn-secondary btn-sm" onClick={refresh}><IconRefresh /> 수동 새로고침</button>
            </div>
          </div>

          {/* Top Scorecard Metrics */}
          <div className="dashboard-stats-grid">
            <div className="stat-card colored-pink">
              <div className="stat-header">
                <span className="caption-uppercase">기획전 누적 페이지 뷰 (PV)</span>
                <IconEye color="var(--colors-brand-pink)" />
              </div>
              <span className="stat-value">{stats.totalPV}</span>
              <span className="caption" style={{color: 'var(--colors-muted)'}}>Total Web Hits</span>
            </div>

            <div className="stat-card colored-teal">
              <div className="stat-header">
                <span className="caption-uppercase">기획전 순 방문자 수 (UV)</span>
                <IconUsers color="var(--colors-brand-teal)" />
              </div>
              <span className="stat-value">{stats.uniqueUV}</span>
              <span className="caption" style={{color: 'var(--colors-muted)'}}>Unique Session UUIDs</span>
            </div>

            <div className="stat-card colored-lavender">
              <div className="stat-header">
                <span className="caption-uppercase">기획전 평균 체류시간</span>
                <IconClock color="var(--colors-brand-lavender)" />
              </div>
              <span className="stat-value">{stats.avgDuration}</span>
              <span className="caption" style={{color: 'var(--colors-muted)'}}>Session Heartbeat Avg</span>
            </div>

            <div className="stat-card colored-peach">
              <div className="stat-header">
                <span className="caption-uppercase">기획전 이탈률 (Bounce Rate)</span>
                <IconTrendingUp color="var(--colors-brand-peach)" />
              </div>
              <span className="stat-value">{stats.bounceRate}</span>
              <span className="caption" style={{color: 'var(--colors-muted)'}}>Single Page Sessions</span>
            </div>

            <div className="stat-card colored-ochre">
              <div className="stat-header">
                <span className="caption-uppercase">기획전 기여 매출액 (Last-Touch)</span>
                <IconSparkles color="var(--colors-brand-ochre)" />
              </div>
              <span className="stat-value" style={{ fontSize: '26px', lineHeight: '38px' }}>{stats.revenue}</span>
              <span className="caption" style={{color: 'var(--colors-muted)'}}>Conversion Sales Revenue</span>
            </div>
          </div>

          {/* Dynamic SVG Funnel and Raw Activity stream */}
          <div className="dashboard-charts-grid">
            
            {/* SVF Funnel */}
            <div className="chart-card">
              <div>
                <h3 className="title-md">LF Mall 퍼널 전환율 분석 (Conversion Funnel)</h3>
                <p className="body-sm" style={{color: 'var(--colors-muted)'}}>고객 여정의 메인 홈 진입부터 최종 주문 결제 완료까지의 퍼널 전환율을 시각화합니다.</p>
              </div>
              <div className="svg-funnel-container">
                <svg viewBox="0 0 500 220" width="100%" height="100%">
                  {funnel.map((step, idx) => {
                    const maxBarWidth = 310;
                    const barWidth = Math.max((step.rate / 100) * maxBarWidth, 20);
                    const barHeight = 24;
                    const xStart = 150;
                    const yStart = idx * 42 + 10;
                    const barColor = step.color;
                    return (
                      <g key={step.name}>
                        <text x="10" y={yStart + 16} fill="var(--colors-ink)" fontSize="11" fontWeight="600">
                          {step.name}
                        </text>
                        <rect x={xStart} y={yStart} width={maxBarWidth} height={barHeight} fill="var(--colors-surface-soft)" rx="6" />
                        <rect x={xStart} y={yStart} width={barWidth} height={barHeight} fill={barColor} rx="6" style={{ transition: 'width 0.5s ease-out' }} />
                        <text x={xStart + Math.max(barWidth - 40, 10)} y={yStart + 16} fill={idx === 1 || idx === 4 ? '#ffffff' : 'var(--colors-ink)'} fontSize="11" fontWeight="700">
                          {step.rate}%
                        </text>
                        <text x={xStart + maxBarWidth + 10} y={yStart + 16} fill="var(--colors-muted)" fontSize="12" fontWeight="500">
                          {step.count.toLocaleString()} 명
                        </text>
                      </g>
                    );
                  })}
                </svg>
              </div>
            </div>

            {/* Real-time Activity stream */}
            <div className="chart-card">
              <div className="flex-row-between">
                <div>
                  <h3 className="title-md" style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
                    <IconZap color="var(--colors-brand-pink)" /> 실시간 데이터 분석 스트림
                  </h3>
                  <p className="body-sm" style={{color: 'var(--colors-muted)'}}>LF Mall 몰 내에서 실시간으로 갱신되는 유저 트래킹 패킷 로그입니다.</p>
                </div>
                <span className="caption-uppercase" style={{backgroundColor: '#e6f4ea', color: 'var(--colors-brand-mint)', padding: '2px 8px', borderRadius: '4px', fontSize: '11px'}}>
                  Streaming
                </span>
              </div>
              <div className="realtime-log-panel">
                {logs.slice(0, 12).map((log, index) => {
                  const isExPageView = log.type === 'PAGE_VIEW' && (extractExhibitionId(log.url) || log.extra?.exhibitionId);
                  return (
                    <div key={index} className="log-entry-row">
                      <span className="log-time">{formatTime(log.timestamp)}</span>
                      <span className="log-desc">
                        {isExPageView && (
                          <span>기획전 방문 <strong style={{color: 'var(--colors-brand-pink)'}}>{log.extra?.exhibitionTitle || EXHIBITION_METADATA[log.extra?.exhibitionId || extractExhibitionId(log.url)] || '기획전'}</strong> <code style={{backgroundColor: 'var(--colors-surface-strong)', padding: '2px 6px', borderRadius: '4px', fontSize: '11px', fontFamily: 'monospace'}}>{log.url}</code></span>
                        )}
                        {!isExPageView && log.type === 'PAGE_VIEW' && (
                          <span>페이지 방문 <code style={{backgroundColor: 'var(--colors-surface-strong)', padding: '2px 6px', borderRadius: '4px', fontSize: '11px', fontFamily: 'monospace'}}>{log.url}</code></span>
                        )}
                        {log.type === 'CLICK' && <span>액션 클릭 <strong>{log.elementId}</strong></span>}
                        {log.type === 'ADD_TO_CART' && (
                          <span>장바구니 담기 (기획전 기여: <strong style={{color: 'var(--colors-brand-teal)'}}>{EXHIBITION_METADATA[log.extra?.lastExhibitionId] || '기획전'}</strong>) - <strong>{log.extra?.productId}</strong> (₩{log.extra?.price?.toLocaleString()})</span>
                        )}
                        {log.type === 'PURCHASE' && (
                          <span style={{color: '#0d5a4e', fontWeight: 600}}>주문 결제완료 (기획전 기여: <strong style={{color: 'var(--colors-brand-teal)'}}>{EXHIBITION_METADATA[log.extra?.attributedExhibitionId] || '기획전'}</strong>) - {log.extra?.orderId} <strong style={{fontSize: '13px', color: 'var(--colors-brand-pink)'}}>₩{log.extra?.revenue?.toLocaleString()}</strong> 완료 🎉</span>
                        )}
                      </span>
                      <span className={`${getPageTypeClass(log.pageType)}`} style={{fontSize: '10px', textTransform: 'uppercase'}}>
                        {log.pageType}
                      </span>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          {/* Directory of Page performances */}
          <div className="chart-card">
            <div>
              <h3 className="title-md">🔥 현재 운영 중인 실시간 기획전 성과 순위</h3>
              <p className="body-sm" style={{color: 'var(--colors-muted)'}}>현재 활성화되어 있는 각 기획전별 순 유저(UV), 체류시간, 전환율 및 Last-Touch 기여 매출액 랭킹입니다.</p>
            </div>
            <div className="table-container">
              <table className="analytics-table">
                <thead>
                  <tr>
                    <th>기획전 번호 (ID)</th>
                    <th>기획전 명칭 (Campaign Title)</th>
                    <th style={{ textAlign: 'right' }}>누적 조회수 (PV)</th>
                    <th style={{ textAlign: 'right' }}>순 방문자 (UV)</th>
                    <th style={{ textAlign: 'right' }}>평균 체류시간</th>
                    <th style={{ textAlign: 'right' }}>이탈률</th>
                    <th style={{ textAlign: 'right' }}>기여 매출액 (KRW)</th>
                    <th style={{ textAlign: 'right' }}>구매 전환율 (CVR)</th>
                  </tr>
                </thead>
                <tbody>
                  {pages.map((p, idx) => (
                    <tr key={p.id || idx}>
                      <td style={{fontFamily: 'monospace', fontWeight: 600, color: 'var(--colors-muted)'}}>{p.id}</td>
                      <td style={{fontWeight: 600, color: 'var(--colors-ink)'}}>{p.title}</td>
                      <td style={{textAlign: 'right', fontWeight: 700}}>{p.pv.toLocaleString()}</td>
                      <td style={{textAlign: 'right'}}>{p.uv.toLocaleString()}</td>
                      <td style={{textAlign: 'right'}}>{p.avgStay}</td>
                      <td style={{textAlign: 'right', color: parseFloat(p.bounceRate) > 40 ? 'var(--colors-warning)' : 'var(--colors-success)', fontWeight: 600}}>{p.bounceRate}</td>
                      <td style={{textAlign: 'right', fontWeight: 700, color: 'var(--colors-brand-pink)'}}>₩{p.revenue.toLocaleString()}</td>
                      <td style={{textAlign: 'right', fontWeight: 700, color: 'var(--colors-brand-teal)'}}>{p.cvr}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* Controls Simulation */}
          <div className="simulation-drawer">
            <div className="simulation-info-text">
              <h4 className="title-sm" style={{display: 'flex', alignItems: 'center', gap: '6px'}}>
                <span>⚙️</span> 실시간 트래픽 가동 시뮬레이터 (Simulator Control)
              </h4>
              <p className="body-sm" style={{color: 'var(--colors-muted)'}}>실시간 유저 행동 시뮬레이션을 켜서 매출 증가, 전환 차트 변동, 텔레메트리 스트림의 갱신을 바로 모니터링할 수 있습니다.</p>
            </div>
            <div style={{display: 'flex', gap: '12px'}}>
              <button className="btn btn-secondary" onClick={handleSimSingle}><IconZap /> 단일 패킷 생성</button>
              <button className={`btn ${isSimulating ? 'btn-primary' : 'btn-secondary'}`} onClick={() => setIsSimulating(!isSimulating)} style={{ backgroundColor: isSimulating ? 'var(--colors-brand-pink)' : 'var(--colors-canvas)', color: isSimulating ? '#ffffff' : 'var(--colors-ink)' }}>
                {isSimulating ? <><IconPause /> 자동 수집 중지</> : <><IconPlay /> 자동 수집 가동</>}
              </button>
              <button className="btn btn-secondary" style={{color: 'var(--colors-error)'}} onClick={handleClear}><IconTrash /> 데이터 초기화</button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================================================
    // 5. MAIN PLATFORM APP COORDINATOR
    // ==========================================================================

    function App() {
      return (
        <div className="app-container">
          <div className="prototype-controller">
            <div className="prototype-title-group">
              <div className="logo-badge"><span>Clay.</span></div>
              <span className="logo-text">Growth Telemetry Engine — LF Mall Analyzer</span>
            </div>
            <div style={{display: 'flex', alignItems: 'center', gap: '8px', color: 'var(--colors-muted)', fontSize: '13px', fontWeight: 500}}>
              <IconHelp /> Zero-Dependency Telemetry Mode (www.lfmall.co.kr)
            </div>
          </div>

          <main className="workspace-frame">
            <div className="pane dashboard-pane-container" style={{ width: '100%' }}>
              <AnalyticsDashboard />
            </div>
          </main>
        </div>
      );
    }

    // Mounting React to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
