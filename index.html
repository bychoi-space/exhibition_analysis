  <!-- Inline Babel Script (100% Immune to CORS on file:// protocol!) -->

    const IconHelp = () => (
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10" /><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><line x1="12" x2="12.01" y1="17" y2="17" /></svg>
    );

    // ==========================================================================
    // ==========================================================================
    // 2. LF MALL METRICS SIMULATED TELEMETRY DATABASE (Korean & Exhibition Focused)
    // ==========================================================================

    const STORAGE_KEY = 'lfmall_analytics_events';
    const USER_KEY = 'lfmall_analytics_user';
    const SESSION_KEY = 'lfmall_analytics_session';

    const EXHIBITION_METADATA = {
      '103291': '닥스 봄 데일리 스페셜 위크 (DAKKS)',
      '992831': '아떼 바캉스 실크 원피스 컬렉션 (ATHE)',
      '553920': '헤지스 남성 트렌디 린넨 캐주얼 대전 (HAZZYS)',
      '402391': '명품 해외 패션 럭셔리 시즌 오프 (LUXURY)',
      '101001': '질스튜어트 뉴욕 남성 서머 에센셜 (JILLSTUART)',
      '101002': '라푸마 캠핑 테크 서머 컬렉션 (LAFUMA)',
      '101003': '바네사브루노 아일렛 자수 블라우스 단독 기획 (VANESSABRUNO)',
      '101004': '콜한 초경량 남성 드레스 스니커즈 (COLE HAAN)',
      '101005': '앳코너 로맨틱 린넨 원피스 컬렉션 (A.T.CORNER)',
      '101006': '마에스트로 이태리 쿨 서머 비즈니스 룩 (MAESTRO)',
      '101007': '레오나드 플로럴 실크 가디건 페스티벌 (LEONARD)',
      '101008': 'TNGT 클래식 남성 리넨 셋업 수트 대전 (TNGT)',
      '101009': '버켄스탁 독일 직수입 여름 샌들전 (BIRKENSTOCK)',
      '101010': '이자벨마랑 파리지앵 서머 아우터 팝업 (ISABEL MARANT)',
      '101011': '닥스 골프 26SS 프리미엄 필드 룩 (DAKS GOLF)',
      '101012': '헤지스 레이디스 프렌치 리넨 셔츠전 (HAZZYS LADIES)',
      '101013': '질바이질스튜어트 슈즈 페스티벌 (JILL BY JILLSTUART)',
      '101014': '블랙야크 키즈 액티브 아웃도어 기획 (BLACK YAK)',
      '101015': '일꼬르소 실루엣 린넨 니트 단독 특가 (IL CORSO)',
      '101016': '바네사브루노 아떼 에스닉 프린트 로브 (ATHE VB)',
      '101017': '헤지스 골프 여름 메쉬 보스턴백 컬렉션 (HAZZYS GOLF)',
      '101018': '핏플랍 26SS 샌들 & 슬라이드 특가전 (FITFLOP)',
      '101019': '닥스 액세서리 엠보 가죽 크로스백 (DAKS ACC)',
      '101020': '바버 헤리티지 여름 퀼팅 자켓 & 자외선 차단 대전 (BARBOUR)',
      '101021': '헤지스 키즈 캐주얼 피케 셔츠 균일가 (HAZZYS KIDS)',
      '101022': '닥스 슈즈 컴포트 플랫슈즈 특가 위크 (DAKS SHOES)',
      '101023': '이자벨마랑 에뚜왈 로맨틱 코튼 드레스 (MARANT ETOP)',
      '101024': '질스튜어트 스포츠 통기성 쿨링 트레이닝 (JILLSTUART SPORT)',
      '101025': '라푸마 쿨웨어 기능성 티셔츠 기획 (LAFUMA COOL)',
      '101026': '바네사브루노 파리 패션쇼 아카이브전 (VANESSABRUNO PARIS)',
      '101027': '레오나드 26SS 보타닉 원피스 팝업 (LEONARD BOTANIC)',
      '101028': '콜한 제로그랜드 캐주얼 로퍼 페스티벌 (COLE HAAN ZEROGRAND)',
      '101029': 'TNGT 미니멀 서머 반팔 니트 특전 (TNGT MINIMAL)',
      '101030': '핏플랍 컴포트 샌들 시즌오프 특가 (FITFLOP OUTLET)'
    };

    const getOrGenerateId = (key, storage) => {
      let id = storage.getItem(key);
      if (!id) {
        id = 'id_lf_' + Math.random().toString(36).substring(2, 12) + Date.now().toString(36);
        storage.setItem(key, id);
      }
      return id;
    };

    const getUserId = () => getOrGenerateId(USER_KEY, localStorage);
    const getSessionId = () => getOrGenerateId(SESSION_KEY, sessionStorage);

    const extractExhibitionId = (urlPath) => {
      if (!urlPath) return null;
      const matchA = urlPath.match(/\/app\/event\/([a-zA-Z0-9_-]+)/);
      if (matchA) return matchA[1];
      const matchB = urlPath.match(/datacls=([a-zA-Z0-9_-]+)/);
      if (matchB) return matchB[1];
      return null;
    };

    // Seed realistic statistics representing lfmall.co.kr fashion traffic (100% Focused on Exhibitions)
    const seedDatabase = () => {
      console.log('Seeding client exhibition telemetry database...');
      const events = [];
      const now = Date.now();
      const exhibitionIds = Object.keys(EXHIBITION_METADATA);
      
      const userCount = 520;
      const sessionCount = 890;
      const userIds = Array.from({ length: userCount }, (_, i) => `user_lf_${i}_${Math.random().toString(36).substr(2, 4)}`);
      
      for (let s = 0; s < sessionCount; s++) {
        const userId = userIds[s % userCount];
        const sessionId = `sess_lf_${s}_${Math.random().toString(36).substr(2, 4)}`;
        const timeOffset = Math.random() * 5 * 24 * 60 * 60 * 1000; // 5 days
        let timeCursor = now - timeOffset;
        
        // 1. Enter Main Home first (95% chance)
        if (Math.random() < 0.95) {
          events.push({
            timestamp: timeCursor,
            type: 'PAGE_VIEW',
            pageType: 'HOME',
            url: '/',
            sessionId,
            userId,
            extra: { referrer: 'naver_search' }
          });
          timeCursor += 5000 + Math.random() * 15000;
        }
        
        // 2. Click and Enter a specific exhibition! (100% of analyzed traffic)
        const exId = exhibitionIds[s % exhibitionIds.length];
        const isUrlTypeA = Math.random() < 0.5;
        const url = isUrlTypeA 
          ? `/app/event/${exId}` 
          : `/planning.do?cmd=getEventDetail&datacls=${exId}`;

        events.push({
          timestamp: timeCursor,
          type: 'PAGE_VIEW',
          pageType: 'CATEGORY', // exhibition
          url,
          sessionId,
          userId,
          extra: { exhibitionId: exId, exhibitionTitle: EXHIBITION_METADATA[exId] }
        });
        
        // Seed clicks within the exhibition page
        const viewDuration = 8000 + Math.random() * 35000;
        
        if (Math.random() < 0.6) {
          events.push({
            timestamp: timeCursor + (2000 + Math.random() * 3000),
            type: 'CLICK',
            pageType: 'CATEGORY',
            elementId: 'exhibition-main-banner-btn',
            sessionId,
            userId,
            extra: { exhibitionId: exId }
          });
        }
        if (Math.random() < 0.4) {
          events.push({
            timestamp: timeCursor + (5000 + Math.random() * 4000),
            type: 'CLICK',
            pageType: 'CATEGORY',
            elementId: 'download-coupon-btn',
            sessionId,
            userId,
            extra: { exhibitionId: exId }
          });
        }
        if (Math.random() < 0.75) {
          events.push({
            timestamp: timeCursor + viewDuration - 1000,
            type: 'CLICK',
            pageType: 'CATEGORY',
            elementId: 'product-item-link',
            sessionId,
            userId,
            extra: { exhibitionId: exId }
          });
        }

        timeCursor += viewDuration; // Users browse exhibition page for 8-43s
        
        // 3. Clicks on products inside the exhibition page (70% chance)
        if (Math.random() < 0.7) {
          const prodId = `LF-PROD-${10000 + Math.floor(Math.random() * 90000)}`;
          events.push({
            timestamp: timeCursor,
            type: 'PAGE_VIEW',
            pageType: 'PRODUCT_DETAIL',
            url: `/product/${prodId}`,
            sessionId,
            userId,
            extra: { productId: prodId, lastExhibitionId: exId }
          });
          
          timeCursor += 10000 + Math.random() * 40000;
          
          // 4. Add to cart from product (35% chance)
          if (Math.random() < 0.35) {
            const price = 80000 + Math.floor(Math.random() * 450000); // 80k to 530k KRW
            events.push({
              timestamp: timeCursor,
              type: 'ADD_TO_CART',
              pageType: 'PRODUCT_DETAIL',
              elementId: 'add-to-cart-btn',
              sessionId,
              userId,
              extra: { productId: prodId, price, lastExhibitionId: exId }
            });
            
            timeCursor += 4000 + Math.random() * 12000;
            
            events.push({
              timestamp: timeCursor,
              type: 'PAGE_VIEW',
              pageType: 'CART',
              url: '/cart',
              sessionId,
              userId,
              extra: { lastExhibitionId: exId }
            });
            
            timeCursor += 5000 + Math.random() * 10000;
            
            // 5. Start Checkout (60% chance)
            if (Math.random() < 0.6) {
              events.push({
                timestamp: timeCursor,
                type: 'PAGE_VIEW',
                pageType: 'CHECKOUT',
                url: '/order/payment',
                sessionId,
                userId,
                extra: { lastExhibitionId: exId }
              });
              
              timeCursor += 15000 + Math.random() * 40000;
              
              // 6. Complete Purchase and attribute revenue (65% chance)
              if (Math.random() < 0.65) {
                events.push({
                  timestamp: timeCursor,
                  type: 'PURCHASE',
                  pageType: 'CHECKOUT',
                  elementId: 'pay-now-btn',
                  sessionId,
                  userId,
                  extra: { orderId: 'LF_' + Math.floor(200000 + Math.random() * 800000), revenue: price, attributedExhibitionId: exId }
                });
                
                events.push({
                  timestamp: timeCursor + 100,
                  type: 'PAGE_VIEW',
                  pageType: 'PURCHASE',
                  url: '/order/complete',
                  sessionId,
                  userId,
                  extra: { lastExhibitionId: exId }
                });
              }
            }
          }
        }
      }
      
      events.sort((a, b) => a.timestamp - b.timestamp);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
      return events;
    };

    const getRawEvents = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return seedDatabase();
        return JSON.parse(raw);
      } catch (e) {
        return [];
      }
    };

    const saveEvents = (events) => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
      window.dispatchEvent(new CustomEvent('clay_analytics_update'));
    };

    const resetDatabase = () => {
      localStorage.removeItem(STORAGE_KEY);
      seedDatabase();
      window.dispatchEvent(new CustomEvent('clay_analytics_update'));
    };

    // Calculate aggregated statistics locally (Perfect attribution logic match & Date filtering support)
    const getLocalAggregatedStats = (startDate, endDate) => {
      let events = getRawEvents();
      
      if (startDate && endDate) {
        const startParts = startDate.split('-');
        const endParts = endDate.split('-');
        if (startParts.length === 3 && endParts.length === 3) {
          const startTimestamp = new Date(parseInt(startParts[0]), parseInt(startParts[1]) - 1, parseInt(startParts[2]), 0, 0, 0, 0).getTime();
          const endTimestamp = new Date(parseInt(endParts[0]), parseInt(endParts[1]) - 1, parseInt(endParts[2]), 23, 59, 59, 999).getTime();
          if (!isNaN(startTimestamp) && !isNaN(endTimestamp)) {
            events = events.filter(e => e.timestamp >= startTimestamp && e.timestamp <= endTimestamp);
          }
        }
      }
      
      // --- DAILY PERFORMANCE CALCULATION ---
      const dailyStatsMap = {};
      const datesList = [];
      
      if (startDate && endDate) {
        const start = new Date(startDate);
        const end = new Date(endDate);
        let current = new Date(start.getTime());
        let limit = 60; // Safety cap
        while (current <= end && limit > 0) {
          const y = current.getFullYear();
          const m = String(current.getMonth() + 1).padStart(2, '0');
          const d = String(current.getDate()).padStart(2, '0');
          const dateStr = `${y}-${m}-${d}`;
          datesList.push(dateStr);
          dailyStatsMap[dateStr] = { date: dateStr, pv: 0, uvSet: new Set(), revenue: 0 };
          current.setDate(current.getDate() + 1);
          limit--;
        }
      }

      const sessionToLastExhibition = {};
      const exhibitionStats = {};

      // Initialize
      Object.keys(EXHIBITION_METADATA).forEach(id => {
        exhibitionStats[id] = {
          id: id,
          title: EXHIBITION_METADATA[id],
          pv: 0,
          uvSet: new Set(),
          sessionTimes: {},
          attributedRevenue: 0,
          orderCount: 0,
          clicks: 0 // [NEW]
        };
      });

      // Walk through logs chronologically
      events.forEach(e => {
        // 1. Trace event date for daily performance calculation
        const dateObj = new Date(e.timestamp);
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const d = String(dateObj.getDate()).padStart(2, '0');
        const dateStr = `${y}-${m}-${d}`;

        const currentExId = e.extra?.exhibitionId || extractExhibitionId(e.url || '');
        if (currentExId && EXHIBITION_METADATA[currentExId]) {
          sessionToLastExhibition[e.sessionId] = currentExId;
          
          const stats = exhibitionStats[currentExId];
          if (e.type === 'PAGE_VIEW') {
            stats.pv++;
            stats.uvSet.add(e.userId);
            
            if (!stats.sessionTimes[e.sessionId]) stats.sessionTimes[e.sessionId] = [];
            stats.sessionTimes[e.sessionId].push(e.timestamp);

            // Track daily metrics
            if (dailyStatsMap[dateStr]) {
              dailyStatsMap[dateStr].pv++;
              dailyStatsMap[dateStr].uvSet.add(e.userId);
            }
          }
        }

        // 2. Trace click activities on a per-exhibition basis
        if (e.type === 'CLICK') {
          const lastExId = e.extra?.exhibitionId || sessionToLastExhibition[e.sessionId];
          if (lastExId && exhibitionStats[lastExId]) {
            exhibitionStats[lastExId].clicks++;
          }
        }

        if (e.type === 'PURCHASE') {
          const lastExId = e.extra?.attributedExhibitionId || sessionToLastExhibition[e.sessionId];
          if (lastExId && exhibitionStats[lastExId]) {
            const rev = parseInt(e.extra?.revenue || 0);
            exhibitionStats[lastExId].attributedRevenue += rev;
            exhibitionStats[lastExId].orderCount++;

            // Track daily revenue
            if (dailyStatsMap[dateStr]) {
              dailyStatsMap[dateStr].revenue += rev;
            }
          }
        }
      });

      const exhibitionsPerformanceList = Object.values(exhibitionStats).map(ex => {
        const sTimes = Object.values(ex.sessionTimes);
        let totalPTime = 0;
        let singlePViews = 0;
        
        sTimes.forEach(ts => {
          if (ts.length <= 1) {
            singlePViews++;
            totalPTime += 10000;
          } else {
            totalPTime += (Math.max(...ts) - Math.min(...ts));
          }
        });
        
        const avgStay = sTimes.length ? Math.floor((totalPTime / sTimes.length) / 1000) : 0;
        const bounce = sTimes.length ? Math.floor((singlePViews / sTimes.length) * 100) : 0;
        
        return {
          id: ex.id,
          title: ex.title,
          pv: ex.pv,
          uv: ex.uvSet.size,
          clicks: ex.clicks, // [NEW]
          avgStay: `${avgStay}s`,
          bounceRate: `${Math.min(bounce, 75)}%`,
          revenue: ex.attributedRevenue,
          cvr: ex.pv ? ((ex.orderCount / ex.pv) * 100).toFixed(1) + '%' : '0.0%'
        };
      }).sort((a, b) => b.revenue - a.revenue);

      // Scorecards
      const exPageViews = events.filter(e => e.type === 'PAGE_VIEW' && (extractExhibitionId(e.url) !== null || e.extra?.exhibitionId));
      const totalExPV = exPageViews.length;
      const totalExUV = new Set(exPageViews.map(e => e.userId)).size;
      const totalRevenue = exhibitionsPerformanceList.reduce((acc, curr) => acc + curr.revenue, 0);
      const totalClicks = exhibitionsPerformanceList.reduce((acc, curr) => acc + curr.clicks, 0); // [NEW]

      // Funnel
      const funnelSessions = {};
      events.forEach(e => {
        if (!funnelSessions[e.sessionId]) {
          funnelSessions[e.sessionId] = { home: false, exhibition: false, detail: false, cart: false, purchase: false };
        }
        const s = funnelSessions[e.sessionId];
        if (e.pageType === 'HOME') s.home = true;
        if (extractExhibitionId(e.url) || e.extra?.exhibitionId) s.exhibition = true;
        if (e.pageType === 'PRODUCT_DETAIL') s.detail = true;
        if (e.type === 'ADD_TO_CART') s.cart = true;
        if (e.type === 'PURCHASE') s.purchase = true;
      });
      
      const totalF = Object.keys(funnelSessions).length;
      const fSessions = Object.values(funnelSessions);
      const homeCount = fSessions.filter(s => s.home).length;
      const exhCount = fSessions.filter(s => s.exhibition).length;
      const detCount = fSessions.filter(s => s.detail).length;
      const cartCount = fSessions.filter(s => s.cart).length;
      const purCount = fSessions.filter(s => s.purchase).length;
      
      const getPct = (val) => totalF ? Math.floor((val / totalF) * 100) : 0;

      // Format daily performance list
      const dailyPerformance = datesList.map(date => ({
        date,
        pv: dailyStatsMap[date].pv,
        uv: dailyStatsMap[date].uvSet.size,
        revenue: dailyStatsMap[date].revenue
      }));

      return {
        stats: {
          totalPV: totalExPV.toLocaleString(),
          uniqueUV: totalExUV.toLocaleString(),
          totalClicks: totalClicks.toLocaleString(), // [NEW]
          avgDuration: "0m 35s",
          bounceRate: "16%",
          revenue: `₩${totalRevenue.toLocaleString()}`
        },
        funnel: [
          { name: '1. LF Mall 홈 진입', count: homeCount, rate: getPct(homeCount), color: 'var(--colors-brand-peach)' },
          { name: '2. 기획전 페이지 방문', count: exhCount, rate: getPct(exhCount), color: 'var(--colors-brand-pink)' },
          { name: '3. 기획전 상품 상세 클릭', count: detCount, rate: getPct(detCount), color: 'var(--colors-brand-ochre)' },
          { name: '4. 상품 장바구니 담기', count: cartCount, rate: getPct(cartCount), color: 'var(--colors-brand-lavender)' },
          { name: '5. 최종 구매 완료 (결제)', count: purCount, rate: getPct(purCount), color: 'var(--colors-brand-mint)' }
        ],
        pages: exhibitionsPerformanceList,
        dailyPerformance,
        logs: events.slice(-35).reverse()
      };
    };

    // Client-side simulation traffic (Focused entirely on exhibitions!)
    const simulateUserTraffic = () => {
      const userPool = Array.from({ length: 15 }, (_, i) => `sim_user_lf_${Math.floor(Math.random() * 800)}`);
      const exPool = Object.keys(EXHIBITION_METADATA);
      
      const userId = userPool[Math.floor(Math.random() * userPool.length)];
      const sessionId = 'sim_sess_lf_' + Math.random().toString(36).substr(2, 7);
      
      const events = getRawEvents();
      const now = Date.now();
      const rand = Math.random();
      
      const exId = exPool[Math.floor(Math.random() * exPool.length)];
      
      if (rand < 0.4) {
        events.push({ timestamp: now, type: 'PAGE_VIEW', pageType: 'HOME', url: '/', sessionId, userId, extra: { referrer: 'direct_traffic' } });
      } else if (rand < 0.75) {
        const path = Math.random() < 0.5 
          ? `/app/event/${exId}` 
          : `/planning.do?cmd=getEventDetail&datacls=${exId}`;
          
        events.push({
          timestamp: now,
          type: 'PAGE_VIEW',
          pageType: 'CATEGORY',
          url: path,
          sessionId,
          userId,
          extra: { exhibitionId: exId, exhibitionTitle: EXHIBITION_METADATA[exId] }
        });

        // Simulate clicking inside the exhibition
        const clickRand = Math.random();
        if (clickRand < 0.5) {
          events.push({
            timestamp: now + 500,
            type: 'CLICK',
            pageType: 'CATEGORY',
            elementId: 'product-item-link',
            sessionId,
            userId,
            extra: { exhibitionId: exId }
          });
        } else if (clickRand < 0.8) {
          events.push({
            timestamp: now + 800,
            type: 'CLICK',
            pageType: 'CATEGORY',
            elementId: 'download-coupon-btn',
            sessionId,
            userId,
            extra: { exhibitionId: exId }
          });
        }
      } else if (rand < 0.9) {
        const prodId = `LF-PROD-${10000 + Math.floor(Math.random() * 90000)}`;
        const price = 80000 + Math.floor(Math.random() * 350000);
        
        events.push({ timestamp: now, type: 'PAGE_VIEW', pageType: 'PRODUCT_DETAIL', url: `/product/${prodId}`, sessionId, userId, extra: { productId: prodId, lastExhibitionId: exId } });
        
        if (Math.random() < 0.5) {
          events.push({ timestamp: now + 500, type: 'ADD_TO_CART', pageType: 'PRODUCT_DETAIL', elementId: 'add-to-cart-btn', sessionId, userId, extra: { productId: prodId, price, lastExhibitionId: exId } });
        }
      } else {
        const price = 120000 + Math.floor(Math.random() * 400000);
        const ordId = 'LF_' + Math.floor(200000 + Math.random() * 800000);
        events.push({ timestamp: now, type: 'PURCHASE', pageType: 'CHECKOUT', elementId: 'pay-now-btn', sessionId, userId, extra: { orderId: ordId, revenue: price, attributedExhibitionId: exId } });
        events.push({ timestamp: now + 60, type: 'PAGE_VIEW', pageType: 'PURCHASE', url: '/order/complete', sessionId, userId, extra: {} });
      }
      
      saveEvents(events);
    };


    // ==========================================================================
    // 3. ANALYTICS DASHBOARD VIEW COMPONENT
    // ==========================================================================

    function AnalyticsDashboard() {
      const getFormattedDate = (offsetDays = 0) => {
        const d = new Date();
        d.setDate(d.getDate() - offsetDays);
        return d.toISOString().split('T')[0];
      };

      const [datePreset, setDatePreset] = useState('7d'); // '3d', '7d', '15d', '30d', 'custom'
      const [startDate, setStartDate] = useState(getFormattedDate(7));
      const [endDate, setEndDate] = useState(getFormattedDate(0));

      const [stats, setStats] = useState({ totalPV: "0", uniqueUV: "0", totalClicks: "0", avgDuration: "0s", bounceRate: "0%", revenue: "₩0" });
      const [funnel, setFunnel] = useState([]);
      const [pages, setPages] = useState([]);
      const [dailyPerformance, setDailyPerformance] = useState([]);
      const [logs, setLogs] = useState([]);
      
      const [isSimulating, setIsSimulating] = useState(false);
      const [simCount, setSimCount] = useState(0);

      // Lazy Loading State for Campaign Performance Grid [NEW]
      const [visibleCount, setVisibleCount] = useState(20);
      const [isLoadingMore, setIsLoadingMore] = useState(false);

      useEffect(() => {
        setVisibleCount(20);
      }, [startDate, endDate]);

      const isLiveServer = window.location.protocol.startsWith('http') && !window.location.hostname.endsWith('github.io');

      const refresh = async () => {
        if (isLiveServer) {
          try {
            const res = await fetch(`/api/stats?startDate=${startDate}&endDate=${endDate}`);
            const data = await res.json();
            setStats(data.stats);
            setFunnel(data.funnel);
            setPages(data.pages);
            setDailyPerformance(data.dailyPerformance || []);
            setLogs(data.logs);
          } catch (e) {
            console.error("Failed to fetch live stats from server.", e);
          }
        } else {
          const data = getLocalAggregatedStats(startDate, endDate);
          setStats(data.stats);
          setFunnel(data.funnel);
          setPages(data.pages);
          setDailyPerformance(data.dailyPerformance || []);
          setLogs(data.logs);
        }
      };

      useEffect(() => {
        refresh();
        if (isLiveServer) {
          const poll = setInterval(refresh, 2500); // Live poll every 2.5s
          return () => clearInterval(poll);
        } else {
          const handleUpdate = () => {
            const data = getLocalAggregatedStats(startDate, endDate);
            setStats(data.stats);
            setFunnel(data.funnel);
            setPages(data.pages);
            setDailyPerformance(data.dailyPerformance || []);
            setLogs(data.logs);
          };
          window.addEventListener('clay_analytics_update', handleUpdate);
          return () => window.removeEventListener('clay_analytics_update', handleUpdate);
        }
      }, [startDate, endDate]);

      const handlePresetChange = (preset) => {
        setDatePreset(preset);
        const today = getFormattedDate(0);
        setEndDate(today);
        if (preset === '3d') {
          setStartDate(getFormattedDate(3));
        } else if (preset === '7d') {
          setStartDate(getFormattedDate(7));
        } else if (preset === '15d') {
          setStartDate(getFormattedDate(15));
        } else if (preset === '30d') {
          setStartDate(getFormattedDate(30));
        }
      };

      useEffect(() => {
        let timer = null;
        if (isSimulating) {
          timer = setInterval(async () => {
            if (isLiveServer) {
              try {
                await fetch('/api/simulate', { method: 'POST' });
                refresh();
              } catch (e) {
                console.error("Failed to simulate traffic on live server.", e);
              }
            } else {
              simulateUserTraffic();
              setSimCount(c => c + 1);
            }
          }, 1500);
        }
        return () => { if (timer) clearInterval(timer); };
      }, [isSimulating]);

      const handleClear = async () => {
        if (confirm('모든 수집된 트래픽 통계 로그를 삭제하고 초기화하시겠습니까?')) {
          if (isLiveServer) {
            try {
              await fetch('/api/reset', { method: 'POST' });
              refresh();
            } catch (e) {
              console.error("Failed to reset database on live server.", e);
            }
          } else {
            resetDatabase();
            setIsSimulating(false);
            setSimCount(0);
          }
        }
      };

      const handleSimSingle = async () => {
        if (isLiveServer) {
          try {
            await fetch('/api/simulate', { method: 'POST' });
            refresh();
          } catch (e) {
            console.error("Failed to simulate single action on live server.", e);
          }
        } else {
          simulateUserTraffic();
          setSimCount(c => c + 1);
        }
      };

      const formatTime = (ts) => {
        const d = new Date(ts);
        return d.toTimeString().split(' ')[0];
      };

      const getPageTypeClass = (type) => `page-type-pill ${type.toLowerCase()}`;

      // Daily chart calculations
      const [selectedMetric, setSelectedMetric] = useState('pv'); // 'pv', 'uv', 'revenue'
      const [hoveredIndex, setHoveredIndex] = useState(null);

      const paddingLeft = 50;
      const paddingRight = 30;
      const paddingTop = 20;
      const paddingBottom = 30;
      const chartWidth = 620 - paddingLeft - paddingRight;
      const chartHeight = 220 - paddingTop - paddingBottom;

      const { points, maxVal, gridLines, linePath, areaPath } = useMemo(() => {
        if (!dailyPerformance || dailyPerformance.length === 0) {
          return { points: [], maxVal: 1, gridLines: [], linePath: '', areaPath: '' };
        }

        const values = dailyPerformance.map(d => d[selectedMetric] || 0);
        let maxValue = Math.max(...values, 0);
        let maxVal = maxValue > 0 ? maxValue : 10;
        
        // Add 15% headroom
        maxVal = Math.ceil(maxVal * 1.15);

        // Grid lines (4 divisions)
        const gridLines = [0, Math.floor(maxVal * 0.33), Math.floor(maxVal * 0.66), maxVal];

        const N = dailyPerformance.length;
        const points = dailyPerformance.map((item, idx) => {
          const x = paddingLeft + (idx / Math.max(N - 1, 1)) * chartWidth;
          const y = (220 - paddingBottom) - (item[selectedMetric] / maxVal) * chartHeight;
          return { x, y };
        });

        const linePath = points.length > 0 
          ? `M ${points[0].x} ${points[0].y} L ${points.map(p => `${p.x} ${p.y}`).join(' L ')}` 
          : '';
          
        const areaPath = points.length > 0
          ? `M ${points[0].x} ${220 - paddingBottom} L ${points.map(p => `${p.x} ${p.y}`).join(' L ')} L ${points[points.length - 1].x} ${220 - paddingBottom} Z`
          : '';

        return { points, maxVal, gridLines, linePath, areaPath };
      }, [dailyPerformance, selectedMetric, chartWidth, chartHeight]);

      const formatDateLabel = (dateStr) => {
        if (!dateStr) return '';
        const parts = dateStr.split('-');
        if (parts.length !== 3) return dateStr;
        return `${parseInt(parts[1])}/${parseInt(parts[2])}`;
      };

      const shouldShowLabel = (idx, total) => {
        if (total <= 8) return true;
        if (total <= 15) return idx % 2 === 0;
        if (total <= 30) return idx % 4 === 0;
        return idx % 6 === 0;
      };

      const formatAxisValue = (val, metric) => {
        if (metric === 'revenue') {
          if (val >= 1000000) return `${(val / 1000000).toFixed(1)}M`;
          if (val >= 1000) return `${(val / 1000).toFixed(0)}K`;
          return val.toString();
        }
        if (val >= 1000) return `${(val / 1000).toFixed(1)}K`;
        return val.toString();
      };

      // View Mode Toggle (Cumulative vs Daily Average) [NEW]
      const [viewMode, setViewMode] = useState('cumulative'); // 'cumulative', 'average'

      const daysCount = useMemo(() => {
        const start = new Date(startDate);
        const end = new Date(endDate);
        const diffTime = Math.abs(end - start);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
        return diffDays > 0 ? diffDays : 1;
      }, [startDate, endDate]);

      const displayStats = useMemo(() => {
        if (viewMode === 'cumulative') return stats;
        const rawPV = parseInt(stats.totalPV.replace(/,/g, '')) || 0;
        const rawUV = parseInt(stats.uniqueUV.replace(/,/g, '')) || 0;
        const rawClicks = parseInt(stats.totalClicks.replace(/,/g, '')) || 0;
        const rawRev = parseInt(stats.revenue.replace(/[^0-9]/g, '')) || 0;
        
        return {
          ...stats,
          totalPV: Math.round(rawPV / daysCount).toLocaleString(),
          uniqueUV: Math.round(rawUV / daysCount).toLocaleString(),
          totalClicks: Math.round(rawClicks / daysCount).toLocaleString(),
          revenue: `₩${Math.round(rawRev / daysCount).toLocaleString()}`
        };
      }, [stats, viewMode, daysCount]);

      const displayFunnel = useMemo(() => {
        if (viewMode === 'cumulative') return funnel;
        return funnel.map(step => ({
          ...step,
          count: Math.round(step.count / daysCount)
        }));
      }, [funnel, viewMode, daysCount]);

      const displayPages = useMemo(() => {
        if (viewMode === 'cumulative') return pages;
        return pages.map(p => ({
          ...p,
          pv: Math.round(p.pv / daysCount),
          uv: Math.round(p.uv / daysCount),
          clicks: Math.round(p.clicks / daysCount),
          revenue: Math.round(p.revenue / daysCount)
        }));
      }, [pages, viewMode, daysCount]);

      return (
        <div className="dashboard-pane" style={{ maxWidth: '1500px', padding: 'var(--spacing-xl) var(--spacing-lg)' }}>
          
          {/* Dashboard Title Header */}
          <div className="dashboard-header-group">
            <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
              <img src="./exhibition_analytics_icon.png" alt="LFmall 기획전 성과 분석" style={{ width: '48px', height: '48px', borderRadius: 'var(--rounded-md)', border: '1px solid var(--colors-hairline)', boxShadow: '0 2px 8px rgba(0, 0, 0, 0.05)' }} />
              <div>
                <span className="caption-uppercase" style={{color: 'var(--colors-muted)', display: 'flex', alignItems: 'center', gap: '6px', fontSize: '11px', fontWeight: 600, letterSpacing: '0.05em'}}>
                  REAL-TIME GROWTH TELEMETRY
                </span>
                <h2 className="display-sm" style={{marginTop: '2px', fontWeight: 600, color: 'var(--colors-ink)', fontSize: '24px', letterSpacing: '-0.02em'}}>LFmall 기획전 성과 분석</h2>
              </div>
            </div>
            <div style={{display: 'flex', gap: '12px', alignItems: 'center'}}>
              {isSimulating && (
                <div className="realtime-indicator-pulse">
                  <span className="pulse-dot"></span>
                  <span>실시간 트래픽 수집 중 ({simCount} hits)</span>
                </div>
              )}
              <button className="btn btn-secondary btn-sm" onClick={refresh}><IconRefresh /> 수동 새로고침</button>
            </div>
          </div>
 
          {/* Date Range Selector Panel (Clay.com styled) */}
          <div className="simulation-drawer" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', backgroundColor: 'var(--colors-surface-soft)', padding: '12px 20px', borderRadius: 'var(--rounded-lg)', marginBottom: 'var(--spacing-md)', border: '1px solid var(--colors-hairline)', marginTop: '8px' }}>
            <div style={{ display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap' }}>
              <span style={{ fontSize: '13px', fontWeight: 600, color: 'var(--colors-muted)', marginRight: '8px' }}>조회 기간:</span>
              {['3d', '7d', '15d', '30d', 'custom'].map(preset => {
                const labels = { '3d': '최근 3일', '7d': '최근 7일', '15d': '최근 15일', '30d': '최근 30일', 'custom': '직접 지정' };
                const isActive = datePreset === preset;
                return (
                  <button
                    key={preset}
                    className={`btn btn-sm ${isActive ? 'btn-primary' : 'btn-secondary'}`}
                    onClick={() => handlePresetChange(preset)}
                    style={{
                      height: '28px',
                      fontSize: '12px',
                      padding: '4px 12px',
                      backgroundColor: isActive ? 'var(--colors-brand-teal)' : 'var(--colors-canvas)',
                      color: isActive ? '#ffffff' : 'var(--colors-ink)',
                      borderRadius: 'var(--rounded-pill)',
                      border: isActive ? 'none' : '1px solid var(--colors-hairline)'
                    }}
                  >
                    {labels[preset]}
                  </button>
                );
              })}
            </div>
            
            <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
              <input
                type="date"
                className="text-input"
                value={startDate}
                onChange={(e) => {
                  setStartDate(e.target.value);
                  setDatePreset('custom');
                }}
                disabled={datePreset !== 'custom'}
                style={{
                  height: '32px',
                  padding: '4px 10px',
                  fontSize: '12px',
                  borderRadius: 'var(--rounded-sm)',
                  backgroundColor: datePreset === 'custom' ? 'var(--colors-canvas)' : 'var(--colors-surface-strong)',
                  border: '1px solid var(--colors-hairline)',
                  fontFamily: 'monospace'
                }}
              />
              <span style={{ fontSize: '12px', color: 'var(--colors-muted)', fontWeight: 600 }}>~</span>
              <input
                type="date"
                className="text-input"
                value={endDate}
                onChange={(e) => {
                  setEndDate(e.target.value);
                  setDatePreset('custom');
                }}
                disabled={datePreset !== 'custom'}
                style={{
                  height: '32px',
                  padding: '4px 10px',
                  fontSize: '12px',
                  borderRadius: 'var(--rounded-sm)',
                  backgroundColor: datePreset === 'custom' ? 'var(--colors-canvas)' : 'var(--colors-surface-strong)',
                  border: '1px solid var(--colors-hairline)',
                  fontFamily: 'monospace'
                }}
              />
            </div>
          </div>

          {/* Interactive Daily Performance Trend SVG Chart (Clay.com Aesthetic) */}
          <div className="chart-card daily-trend-chart-card" style={{ marginBottom: 'var(--spacing-md)' }}>
            <div className="trend-chart-header" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '12px' }}>
              <div>
                <h3 className="title-md" style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                  <span>📈</span> 기획전 일별 통합 성과 추이 (Daily Performance Trend)
                </h3>
                <p className="body-sm" style={{ color: 'var(--colors-muted)', marginTop: '2px' }}>조회 기간 동안의 일자별 성과 변화 추세 및 비즈니스 트렌드를 모니터링합니다.</p>
              </div>
              
              {/* Metric Selection Tabs */}
              <div className="metric-tabs" style={{ display: 'flex', gap: '4px', backgroundColor: 'var(--colors-surface-strong)', padding: '3px', borderRadius: 'var(--rounded-pill)' }}>
                {[
                  { id: 'pv', label: '페이지뷰 (PV)', color: 'var(--colors-brand-pink)' },
                  { id: 'uv', label: '순 방문자 (UV)', color: 'var(--colors-brand-teal)' },
                  { id: 'revenue', label: '기여 매출액 (Revenue)', color: 'var(--colors-brand-ochre)' }
                ].map(tab => {
                  const isActive = selectedMetric === tab.id;
                  const dotColor = tab.id === 'pv' ? 'var(--colors-brand-pink)' : tab.id === 'uv' ? 'var(--colors-brand-teal)' : 'var(--colors-brand-ochre)';
                  return (
                    <button
                      key={tab.id}
                      onClick={() => setSelectedMetric(tab.id)}
                      style={{
                        border: 'none',
                        background: isActive ? 'var(--colors-canvas)' : 'none',
                        color: isActive ? 'var(--colors-ink)' : 'var(--colors-muted)',
                        fontSize: '12px',
                        fontWeight: 600,
                        padding: '6px 14px',

                        transition: 'all 0.2s',
                        display: 'flex',
                        alignItems: 'center',

                    >
                      <span style={{ display: 'inline-block', width: '8px', height: '8px', borderRadius: '50%', backgroundColor: dotColor }}></span>
                      {tab.label}
                    </button>
                  );
                })}
              </div>
            </div>
            
            <div className="trend-chart-body" style={{ marginTop: 'var(--spacing-md)', position: 'relative', height: '220px' }}>
              {dailyPerformance.length === 0 ? (
                <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--colors-muted-soft)', fontSize: '13px' }}>
                  선택된 기간에 분석 데이터가 존재하지 않습니다.
                </div>
              ) : (
                <svg viewBox="0 0 620 220" width="100%" height="100%" style={{ overflow: 'visible' }}>
                  {/* Gradients */}
                  <defs>
                    <linearGradient id="grad-pv" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stopColor="var(--colors-brand-pink)" stopOpacity="0.35"/>
                      <stop offset="100%" stopColor="var(--colors-brand-pink)" stopOpacity="0.0"/>
                    </linearGradient>
                    <linearGradient id="grad-uv" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stopColor="var(--colors-brand-teal)" stopOpacity="0.35"/>
                      <stop offset="100%" stopColor="var(--colors-brand-teal)" stopOpacity="0.0"/>
                    </linearGradient>
                    <linearGradient id="grad-revenue" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stopColor="var(--colors-brand-ochre)" stopOpacity="0.35"/>
                      <stop offset="100%" stopColor="var(--colors-brand-ochre)" stopOpacity="0.0"/>
                    </linearGradient>
                  </defs>

                  {/* Grid lines and Left Axis Labels */}
                  {gridLines.map((yVal, i) => {
                    const yCoord = (220 - paddingBottom) - (yVal / maxVal) * chartHeight;
                    return (
                      <g key={i}>
                        <line 
                          x1={paddingLeft} 
                          y1={yCoord} 
                          x2={620 - paddingRight} 
                          y2={yCoord} 
                          stroke="var(--colors-hairline)" 
                          strokeWidth="1"
                        />
                        <text 
                          x={paddingLeft - 10} 
                          y={yCoord + 4} 
                          fill="var(--colors-muted)" 
                          fontSize="10" 
                          textAnchor="end"
                          fontFamily="monospace"
                        >
                          {formatAxisValue(yVal, selectedMetric)}
                        </text>
                      </g>
                    );
                  })}

                  {/* Area fill */}
                  <path 
                    d={areaPath} 
                    fill={`url(#grad-${selectedMetric})`}
                    style={{ transition: 'd 0.3s ease-out' }}
                  />

                  {/* Line path */}
                  <path 
                    d={linePath} 
                    fill="none" 
                    stroke={selectedMetric === 'pv' ? 'var(--colors-brand-pink)' : selectedMetric === 'uv' ? 'var(--colors-brand-teal)' : 'var(--colors-brand-ochre)'} 
                    strokeWidth="2.5"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    style={{ transition: 'd 0.3s ease-out' }}
                  />

                  {/* X Axis Line */}
                  <line 
                    x1={paddingLeft} 
                    y1={220 - paddingBottom} 
                    x2={620 - paddingRight} 
                    y2={220 - paddingBottom} 
                    stroke="var(--colors-muted-soft)" 
                    strokeWidth="1"
                  />

                  {/* X Axis Labels */}
                  {points.map((p, i) => {
                    if (!shouldShowLabel(i, points.length)) return null;
                    return (
                      <text 
                        key={i}
                        x={p.x} 
                        y={220 - paddingBottom + 16} 
                        fill="var(--colors-muted)" 
                        fontSize="10" 
                        textAnchor="middle"
                        fontFamily="monospace"
                      >
                        {formatDateLabel(dailyPerformance[i].date)}
                      </text>
                    );
                  })}

                  {/* Interactive hover column rects */}
                  {points.map((p, i) => {
                    const colWidth = chartWidth / Math.max(points.length, 1);
                    return (
                      <rect
                        key={i}
                        x={p.x - colWidth / 2}
                        y={paddingTop}
                        width={colWidth}
                        height={chartHeight}
                        fill="transparent"
                        style={{ cursor: 'pointer' }}
                        onMouseEnter={() => setHoveredIndex(i)}
                        onMouseLeave={() => setHoveredIndex(null)}
                      />
                    );
                  })}

                  {/* Hover vertical guideline */}
                  {hoveredIndex !== null && points[hoveredIndex] && (
                    <line 
                      x1={points[hoveredIndex].x} 
                      y1={paddingTop} 
                      x2={points[hoveredIndex].x} 
                      y2={220 - paddingBottom} 
                      stroke="var(--colors-muted-soft)" 
                      strokeDasharray="3 3" 
                      strokeWidth="1.5" 
                    />
                  )}

                  {/* Highlight circle on line */}
                  {points.map((p, i) => {
                    const isHovered = hoveredIndex === i;
                    const metricColor = selectedMetric === 'pv' ? 'var(--colors-brand-pink)' : selectedMetric === 'uv' ? 'var(--colors-brand-teal)' : 'var(--colors-brand-ochre)';
                    return (
                      <circle 
                        key={i}
                        cx={p.x}
                        cy={p.y}
                        r={isHovered ? 6 : 3.5}
                        fill="var(--colors-canvas)"
                        stroke={metricColor}
                        strokeWidth={isHovered ? 3 : 2}
                        style={{ transition: 'r 0.15s ease-out, stroke-width 0.15s ease-out' }}
                        pointerEvents="none"
                      />
                    );
                  })}

                  {/* Dynamic Tooltip inside SVG */}
                  {hoveredIndex !== null && dailyPerformance[hoveredIndex] && points[hoveredIndex] && (
                    <g style={{ pointerEvents: 'none' }}>
                      <rect 
                        x={points[hoveredIndex].x - 65} 
                        y={Math.max(points[hoveredIndex].y - 52, 5)} 
                        width="130" 
                        height="40" 
                        rx="6" 
                        fill="var(--colors-surface-dark)" 
                        opacity="0.95" 
                      />
                      <text 
                        x={points[hoveredIndex].x} 
                        y={Math.max(points[hoveredIndex].y - 38, 19)} 
                        fill="var(--colors-on-dark)" 
                        fontSize="9" 
                        fontWeight="600" 
                        textAnchor="middle"
                      >
                        {dailyPerformance[hoveredIndex].date}
                      </text>
                      <text 
                        x={points[hoveredIndex].x} 
                        y={Math.max(points[hoveredIndex].y - 22, 35)} 
                        fill={selectedMetric === 'pv' ? 'var(--colors-brand-pink)' : selectedMetric === 'uv' ? 'var(--colors-brand-mint)' : 'var(--colors-brand-ochre)'} 
                        fontSize="11" 
                        fontWeight="700" 
                        textAnchor="middle"
                      >
                        {selectedMetric === 'revenue' 
                          ? `₩${dailyPerformance[hoveredIndex].revenue.toLocaleString()}` 
                          : `${dailyPerformance[hoveredIndex][selectedMetric].toLocaleString()} ${selectedMetric === 'pv' ? 'PV' : '명'}`
                        }
                      </text>
                    </g>
                  )}
                </svg>
              )}
            </div>
          </div>

          {/* Cumulative vs Daily Average Toggle Selector [NEW] */}
          <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: 'var(--spacing-md)' }}>
            <div className="view-mode-toggle" style={{ display: 'flex', backgroundColor: 'var(--colors-surface-strong)', padding: '3px', borderRadius: 'var(--rounded-pill)', border: '1px solid var(--colors-hairline)', position: 'relative', zIndex: 10 }}>
              {[
                { id: 'cumulative', label: '📊 누적 데이터 (Cumulative)' },
                { id: 'average', label: '⏱️ 일 평균 데이터 (Daily Avg)' }
              ].map(mode => {
                const isActive = viewMode === mode.id;
                return (
                  <button
                    key={mode.id}
                    className={`btn btn-sm ${isActive ? 'btn-primary' : 'btn-secondary'}`}
                    onClick={() => setViewMode(mode.id)}
                    style={{
                      height: '28px',
                      fontSize: '12px',
                      padding: '4px 14px',
                      backgroundColor: isActive ? 'var(--colors-brand-teal)' : 'var(--colors-canvas)',
                      color: isActive ? '#ffffff' : 'var(--colors-ink)',
                      borderRadius: 'var(--rounded-pill)',
                      border: isActive ? 'none' : '1px solid var(--colors-hairline)',
                      cursor: 'pointer',
                      transition: 'all 0.2s',
                      fontWeight: 600
                    }}
                  >
                    {mode.label}
                  </button>
                );
              })}
            </div>
          </div>

          {/* Top Scorecard Metrics */}
          <div className="dashboard-stats-grid">
            <div className="stat-card colored-pink">
              <div className="stat-header">
                <span className="caption-uppercase">
                  {viewMode === 'average' ? '기획전 일 평균 페이지 뷰 (PV)' : '기획전 누적 페이지 뷰 (PV)'}
                </span>
                <IconEye color="var(--colors-brand-pink)" />
              </div>
              <span className="stat-value">{displayStats.totalPV}</span>
              <span className="caption" style={{color: 'var(--colors-muted)'}}>
                {viewMode === 'average' ? 'Daily Avg Hits' : 'Total Web Hits'}
              </span>
            </div>

            <div className="stat-card colored-teal">
              <div className="stat-header">
                <span className="caption-uppercase">
                  {viewMode === 'average' ? '기획전 일 평균 방문자 (UV)' : '기획전 순 방문자 수 (UV)'}
                </span>
                <IconUsers color="var(--colors-brand-teal)" />
              </div>
              <span className="stat-value">{displayStats.uniqueUV}</span>
              <span className="caption" style={{color: 'var(--colors-muted)'}}>
                {viewMode === 'average' ? 'Daily Avg Users' : 'Unique Session UUIDs'}
              </span>
            </div>

            <div className="stat-card colored-mint">
              <div className="stat-header">
                <span className="caption-uppercase">
                  {viewMode === 'average' ? '기획전 일 평균 클릭 활동량' : '기획전 내 클릭 활동량 (Clicks)'}
                </span>
                <IconCursor color="var(--colors-brand-mint)" />
              </div>
              <span className="stat-value">{displayStats.totalClicks}</span>
              <span className="caption" style={{color: 'var(--colors-muted)'}}>
                {viewMode === 'average' ? 'Daily Avg Clicks' : 'Attributed Interactions'}
              </span>
            </div>

            <div className="stat-card colored-lavender">
              <div className="stat-header">
                <span className="caption-uppercase">기획전 평균 체류시간</span>
                <IconClock color="var(--colors-brand-lavender)" />
              </div>
              <span className="stat-value">{displayStats.avgDuration}</span>
              <span className="caption" style={{color: 'var(--colors-muted)'}}>Session Heartbeat Avg</span>
            </div>

            <div className="stat-card colored-peach">
              <div className="stat-header">
                <span className="caption-uppercase">기획전 이탈률 (Bounce Rate)</span>
                <IconTrendingUp color="var(--colors-brand-peach)" />
              </div>
              <span className="stat-value">{displayStats.bounceRate}</span>
              <span className="caption" style={{color: 'var(--colors-muted)'}}>Single Page Sessions</span>
            </div>

            <div className="stat-card colored-ochre">
              <div className="stat-header">
                <span className="caption-uppercase">
                  {viewMode === 'average' ? '기획전 일 평균 기여 매출액' : '기획전 기여 매출액 (Last-Touch)'}
                </span>
                <IconSparkles color="var(--colors-brand-ochre)" />
              </div>
              <span className="stat-value" style={{ fontSize: '26px', lineHeight: '38px' }}>{displayStats.revenue}</span>
              <span className="caption" style={{color: 'var(--colors-muted)'}}>
                {viewMode === 'average' ? 'Daily Avg Sales Revenue' : 'Conversion Sales Revenue'}
              </span>
            </div>
          </div>

          {/* LF Mall 퍼널 전환율 분석 (Conversion Funnel) */}
          <div className="chart-card" style={{ marginBottom: 'var(--spacing-md)' }}>
            <div>
              <h3 className="title-md">
                {viewMode === 'average' ? 'LF Mall 일 평균 퍼널 전환율 분석' : 'LF Mall 퍼널 전환율 분석 (Conversion Funnel)'}
              </h3>
              <p className="body-sm" style={{color: 'var(--colors-muted)'}}>
                {viewMode === 'average' ? '고객 여정별 각 단계의 일 평균 인입 인원을 시각화합니다.' : '고객 여정의 메인 홈 진입부터 최종 주문 결제 완료까지의 퍼널 전환율을 시각화합니다.'}
              </p>
            </div>
            <div className="svg-funnel-container" style={{ maxWidth: '800px', margin: '0 auto', width: '100%' }}>
              <svg viewBox="0 0 500 220" width="100%" height="100%">
                {displayFunnel.map((step, idx) => {
                  const maxBarWidth = 310;
                  const barWidth = Math.max((step.rate / 100) * maxBarWidth, 20);
                  const barHeight = 24;
                  const xStart = 150;
                  const yStart = idx * 42 + 10;
                  const barColor = step.color;
                  return (
                    <g key={step.name}>
                      <text x="10" y={yStart + 16} fill="var(--colors-ink)" fontSize="11" fontWeight="600">
                        {step.name}
                      </text>
                      <rect x={xStart} y={yStart} width={maxBarWidth} height={barHeight} fill="var(--colors-surface-soft)" rx="6" />
                      <rect x={xStart} y={yStart} width={barWidth} height={barHeight} fill={barColor} rx="6" style={{ transition: 'width 0.5s ease-out' }} />
                      <text x={xStart + Math.max(barWidth - 40, 10)} y={yStart + 16} fill={idx === 1 || idx === 4 ? '#ffffff' : 'var(--colors-ink)'} fontSize="11" fontWeight="700">
                        {step.rate}%
                      </text>
                      <text x={xStart + maxBarWidth + 10} y={yStart + 16} fill="var(--colors-muted)" fontSize="12" fontWeight="500">
                        {step.count.toLocaleString()} 명{viewMode === 'average' ? ' / 일' : ''}
                      </text>
                    </g>
                  );
                })}
              </svg>
            </div>
          </div>

          {/* Directory of Page performances - Redesigned as Premium Brand Grid Card with Lazy Loading */}
          <div className="chart-card">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: '12px', marginBottom: 'var(--spacing-md)' }}>
              <div>
                <h3 className="title-md">
                  {viewMode === 'average' ? '🔥 현재 운영 중인 실시간 기획전 성과 순위 (일 평균)' : '🔥 현재 운영 중인 실시간 기획전 성과 순위'}
                </h3>
                <p className="body-sm" style={{color: 'var(--colors-muted)', marginTop: '2px'}}>
                  {viewMode === 'average' ? '현재 활성화되어 있는 각 기획전별 일 평균 성과 지표 랭킹입니다.' : '현재 활성화되어 있는 각 기획전별 순 유저(UV), 체류시간, 전환율 및 Last-Touch 기여 매출액 랭킹입니다.'}
                </p>
              </div>
              <span className="caption-uppercase" style={{ backgroundColor: 'var(--colors-surface-soft)', color: 'var(--colors-brand-teal)', padding: '4px 10px', borderRadius: 'var(--rounded-pill)', fontSize: '11px', fontWeight: 700, border: '1px solid var(--colors-hairline)' }}>
                총 {displayPages.length}개 운영 중
              </span>
            </div>

            {/* Campaign Cards Grid */}
            <div className="campaign-grid">
              {displayPages.slice(0, visibleCount).map((p, idx) => {
                // Dynamically parse brand name inside parentheses
                const brandMatch = p.title.match(/\(([^)]+)\)/);
                const brandName = brandMatch ? brandMatch[1] : 'LF MALL';
                const cleanTitle = p.title.replace(/\([^)]+\)/, '').trim();

                // Dynamic Brand Colors
                const getBrandColor = (brand) => {
                  const b = brand.toUpperCase();
                  if (b.includes('DAKS') || b.includes('닥스')) return 'var(--colors-brand-pink)';
                  if (b.includes('HAZZYS') || b.includes('헤지스')) return 'var(--colors-brand-teal)';
                  if (b.includes('JILL') || b.includes('질스튜어트') || b.includes('질바이')) return 'var(--colors-brand-lavender)';
                  if (b.includes('ATHE') || b.includes('아떼') || b.includes('바네사') || b.includes('앳코너')) return 'var(--colors-brand-ochre)';
                  if (b.includes('LUXURY') || b.includes('명품') || b.includes('이자벨') || b.includes('바버') || b.includes('레오나드')) return 'var(--colors-brand-coral)';
                  return 'var(--colors-brand-mint)';
                };

                const brandColor = getBrandColor(brandName);

                return (
                  <div key={p.id || idx} className="campaign-card" style={{ '--card-brand-color': brandColor }}>
                    <div className="campaign-card-brand-stripe" style={{ backgroundColor: brandColor }} />
                    
                    <div className="campaign-card-header">
                      <span className="campaign-card-brand" style={{ backgroundColor: `${brandColor}15`, color: brandColor }}>
                        {brandName}
                      </span>
                      <span className="campaign-card-id">#{p.id}</span>
                    </div>

                    <h4 className="campaign-card-title" title={p.title}>{cleanTitle}</h4>

                    <div className="campaign-card-metrics">
                      <div className="campaign-metric-item">
                        <span className="campaign-metric-label">
                          {viewMode === 'average' ? '일 평균 PV' : '누적 PV'}
                        </span>
                        <span className="campaign-metric-value">{p.pv.toLocaleString()}</span>
                      </div>
                      <div className="campaign-metric-item">
                        <span className="campaign-metric-label">
                          {viewMode === 'average' ? '일 평균 UV' : '순 방문자'}
                        </span>
                        <span className="campaign-metric-value">{p.uv.toLocaleString()}</span>
                      </div>
                      <div className="campaign-metric-item">
                        <span className="campaign-metric-label">
                          {viewMode === 'average' ? '일 평균 클릭' : '클릭 활동'}
                        </span>
                        <span className="campaign-metric-value" style={{ color: 'var(--colors-brand-pink)', fontWeight: 700 }}>
                          {p.clicks.toLocaleString()}회
                        </span>
                      </div>
                      <div className="campaign-metric-item">
                        <span className="campaign-metric-label">체류 시간</span>
                        <span className="campaign-metric-value">{p.avgStay}</span>
                      </div>
                    </div>

                    <div className="campaign-card-footer">
                      <div className="campaign-ratio-group">
                        <span className="campaign-ratio-badge" title="이탈률">
                          🚪 {p.bounceRate}
                        </span>
                        <span className="campaign-ratio-badge" title="구매 전환율 (CVR)" style={{ color: 'var(--colors-brand-teal)' }}>
                          🎯 {p.cvr}
                        </span>
                      </div>
                      <span className="campaign-revenue-badge">
                        ₩{p.revenue.toLocaleString()}
                      </span>
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Lazy Load Button */}
            {visibleCount < displayPages.length && (
              <div style={{ display: 'flex', justifyContent: 'center', marginTop: 'var(--spacing-lg)' }}>
                <button 
                  className="btn btn-secondary" 
                  onClick={() => {
                    setIsLoadingMore(true);
                    setTimeout(() => {
                      setVisibleCount(prev => prev + 10);
                      setIsLoadingMore(false);
                    }, 800);
                  }}
                  disabled={isLoadingMore}
                  style={{
                    display: 'flex',
                    alignItems: 'center',
                    gap: '8px',
                    padding: '10px 24px',
                    borderRadius: 'var(--rounded-pill)',
                    fontWeight: 600,
                    border: '1px solid var(--colors-hairline)',
                    backgroundColor: 'var(--colors-canvas)',
                    cursor: 'pointer',
                    boxShadow: '0 2px 6px rgba(0,0,0,0.03)',
                    transition: 'all 0.2s',
                    color: 'var(--colors-ink)'
                  }}
                >
                  {isLoadingMore ? (
                    <>
                      <span className="spinner"></span>
                      <span>데이터 집계 분석 중...</span>
                    </>
                  ) : (
                    <>
                      <span>➕ 더 많은 기획전 성과 로드 ({displayPages.length - visibleCount}개 대기)</span>
                    </>
                  )}
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================================================
    // 5. MAIN PLATFORM APP COORDINATOR
    // ==========================================================================

    function App() {
      return (
        <div className="app-container">
          <main className="workspace-frame">
            <div className="pane dashboard-pane-container" style={{ width: '100%' }}>
              <AnalyticsDashboard />
            </div>
          </main>
        </div>
      );
    }

    // Mounting React to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
